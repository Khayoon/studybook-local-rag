name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONNOUSERSITE: "1"
      STUDYBOOK_EMBEDDING_MODE: lexical
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Set up Node.js for syntax validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline backend tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Install optional formatting tools
        if: matrix.os == 'ubuntu-latest'
        run: npm ci --ignore-scripts
      - name: Check source formatting
        if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
